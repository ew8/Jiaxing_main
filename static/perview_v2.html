<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 微信适配：禁止缩放，宽度跟随设备 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>说明文档预览</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #525659; /* 深灰背景，类似阅读器 */
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 10px;
        }

        /* ========== 加载提示 ========== */
        #loading {
            color: #ffffff;
            font-size: 16px;
            margin-top: 40vh;
            text-align: center;
        }

        #loading .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ========== 错误提示 ========== */
        #error {
            color: #ff6b6b;
            font-size: 14px;
            margin-top: 40vh;
            text-align: center;
            display: none;
            padding: 0 20px;
            line-height: 1.6;
        }

        /* ========== PDF 画布 ========== */
        #pdf-canvas {
            max-width: 100%;
            height: auto;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
            display: none; /* 加载完成后再显示 */
        }
    </style>
</head>
<body>

    <!-- 加载动画 -->
    <div id="loading">
        <div class="spinner"></div>
        <p>正在加载 PDF...</p>
    </div>

    <!-- 错误提示 -->
    <div id="error"></div>

    <!-- PDF 渲染目标 -->
    <canvas id="pdf-canvas"></canvas>

    <!-- 1. 引入 PDF.js 核心库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <script>
        // =============================================
        // ⚠️  只需要改这一行！填入你的 PDF 文件地址
        // =============================================
        const PDF_URL = 'https://www.xlnbattery.cn/static/24v7_2026_v1_0.pdf';
        // =============================================

        // 2. 指定 Worker 路径（必须，否则报错）
        pdfjsLib.GlobalWorkerOptions.workerSrc =
            'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // 3. 获取 DOM 元素
        const loadingEl = document.getElementById('loading');
        const errorEl   = document.getElementById('error');
        const canvas    = document.getElementById('pdf-canvas');
        const ctx       = canvas.getContext('2d');

        // 4. 加载并渲染 PDF
        async function renderPDF() {
            try {
                // 加载 PDF 文档
                const pdf = await pdfjsLib.getDocument(PDF_URL).promise;

                // 获取第 1 页（单页 PDF 就取第 1 页）
                const page = await pdf.getPage(1);

                // --- 计算自适应缩放比例 ---
                // 获取 PDF 原始尺寸（scale=1 时）
                const originalViewport = page.getViewport({ scale: 1 });

                // 目标宽度 = 屏幕可用宽度 - 左右各 10px 的 padding
                const targetWidth = window.innerWidth - 20;

                // 计算缩放比
                const scale = targetWidth / originalViewport.width;

                // 获取缩放后的视口
                const viewport = page.getViewport({ scale: scale });

                // --- 处理高清屏（Retina）模糊问题 ---
                const dpr = window.devicePixelRatio || 1;

                // canvas 实际像素 = 逻辑尺寸 × 设备像素比
                canvas.width  = viewport.width  * dpr;
                canvas.height = viewport.height * dpr;

                // canvas CSS 显示尺寸 = 逻辑尺寸（不放大）
                canvas.style.width  = viewport.width  + 'px';
                canvas.style.height = viewport.height + 'px';

                // 将绘制上下文也缩放 dpr 倍
                ctx.scale(dpr, dpr);

                // --- 渲染 PDF 页面到 canvas ---
                await page.render({
                    canvasContext: ctx,
                    viewport: viewport
                }).promise;

                // 渲染完成：隐藏加载动画，显示画布
                loadingEl.style.display = 'none';
                canvas.style.display    = 'block';

            } catch (err) {
                // 加载失败：隐藏加载动画，显示错误信息
                loadingEl.style.display = 'none';
                errorEl.style.display   = 'block';
                errorEl.innerHTML =
                    '❌ PDF 加载失败<br><br>' +
                    '错误信息：' + err.message + '<br><br>' +
                    '常见原因：<br>' +
                    '1. PDF 文件路径不正确<br>' +
                    '2. 跨域问题（服务器未配置 CORS）<br>' +
                    '3. 文件不存在或已损坏';
                console.error('PDF 渲染失败:', err);
            }
        }

        // 5. 页面加载完成后执行
        renderPDF();
    </script>

</body>
</html>
