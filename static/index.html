<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Model Document Generator</title>
  <style>
    :root {
      --paper-width: 595.3pt;
      --paper-height: 841.9pt;
      --ink: #000;
      --canvas: #edf1f4;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.72), transparent 220px),
        var(--canvas);
      color: var(--ink);
      font-family: Calibri, "Segoe UI", Arial, sans-serif;
    }

    button {
      font: inherit;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      justify-content: center;
      padding: 14px 18px;
      background: rgba(237, 241, 244, 0.92);
      border-bottom: 1px solid rgba(15, 23, 42, 0.08);
      backdrop-filter: blur(14px);
    }

    .toolbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      width: min(100%, 1040px);
    }

    .toolbar-heading {
      min-width: 0;
    }

    .toolbar-title {
      overflow: hidden;
      color: #26313c;
      font-size: 14px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .toolbar-status {
      min-height: 16px;
      margin-top: 2px;
      overflow: hidden;
      color: #64748b;
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .toolbar-status.is-error {
      color: #b42318;
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 0 0 auto;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 0 18px;
      border: 1px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: background-color 160ms ease, border-color 160ms ease, transform 160ms ease;
    }

    .button:active {
      transform: translateY(1px);
    }

    .button-secondary {
      background: #fff;
      color: #26313c;
      border-color: #cfd8e0;
    }

    .button-secondary:hover {
      border-color: #98a8b7;
    }

    .button-primary {
      background: #176b55;
      color: #fff;
    }

    .button-primary:hover {
      background: #125844;
    }

    .button:disabled {
      cursor: wait;
      opacity: 0.55;
    }

    .preview {
      padding: 30px 16px 56px;
    }

    .paper-stage {
      position: relative;
      width: min(100%, 990px);
      margin: 0 auto;
    }

    .paper {
      position: absolute;
      top: 0;
      left: 50%;
      width: var(--paper-width);
      height: var(--paper-height);
      overflow: hidden;
      background: #fff;
      box-shadow: 0 18px 55px rgba(16, 30, 42, 0.16);
      transform-origin: top left;
      print-color-adjust: exact;
      -webkit-print-color-adjust: exact;
    }

    .paper[aria-busy="true"] {
      opacity: 0.55;
    }

    .page-title,
    .batch-info,
    .model-title,
    .specs,
    .warning-title,
    .warning-copy,
    .table-heading,
    .materials-table {
      position: absolute;
      z-index: 2;
      margin: 0;
      color: var(--ink);
    }

    .page-title {
      top: 41.85pt;
      left: 76.56pt;
      max-width: 385pt;
      font-size: 14.05pt;
      font-weight: 700;
      line-height: 1;
    }

    .batch-info {
      top: 41.85pt;
      right: 23.5pt;
      max-width: 150pt;
      font-size: 9.3pt;
      line-height: 1;
      text-align: right;
      white-space: nowrap;
    }

    .batch-info strong {
      font-weight: 700;
    }

    .model-title {
      top: 117.07pt;
      left: 76.56pt;
      max-width: 430pt;
      font-size: 18pt;
      font-weight: 700;
      line-height: 1;
      overflow-wrap: anywhere;
    }

    .brand-logo {
      position: absolute;
      z-index: 0;
      top: 159.14pt;
      left: 285.56pt;
      width: 250.87pt;
      height: 110.73pt;
      object-fit: fill;
    }

    .specs {
      top: 149.77pt;
      left: 76.56pt;
      width: 468pt;
      max-height: 257pt;
      overflow: hidden;
      font-size: 10.45pt;
      line-height: 13.98pt;
    }

    .specs p {
      margin: 0 0 9.42pt;
      line-height: 13.98pt;
    }

    .specs p:last-child {
      margin-bottom: 0;
    }

    .email-phone {
      display: flex;
      gap: 42pt;
      white-space: nowrap;
    }

    .warning-icon {
      position: absolute;
      z-index: 0;
      top: 407.04pt;
      left: 69.6pt;
      width: 15.96pt;
      height: 13.32pt;
      object-fit: fill;
    }

    .warning-title {
      top: 407.03pt;
      left: 87pt;
      font-size: 10.45pt;
      font-weight: 700;
      line-height: 1;
    }

    .warning-title::after {
      content: ":";
    }

    .warning-copy {
      top: 430.57pt;
      left: 76.56pt;
      width: 496pt;
      font-size: 10.45pt;
      line-height: 23.4pt;
    }

    .warning-copy span {
      display: block;
      white-space: nowrap;
    }

    .certifications {
      position: absolute;
      z-index: 0;
      top: 485pt;
      left: 76.56pt;
      width: 451pt;
      height: 74pt;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8pt;
    }

    .certification {
      display: none;
      flex: 1 1 0;
      width: 100%;
      min-width: 0;
      height: 70pt;
      object-fit: contain;
    }

    .certification.is-visible {
      display: block;
    }

    .table-heading {
      top: 633.23pt;
      left: 76.56pt;
      font-size: 10.45pt;
      font-weight: 700;
      line-height: 1;
    }

    .materials-table {
      top: 652.2pt;
      left: 75.95pt;
      width: 451.2pt;
      height: 82.24pt;
      table-layout: fixed;
      border-collapse: collapse;
      font-size: 10.45pt;
      line-height: 1;
    }

    .materials-table col:nth-child(1) {
      width: 149.8pt;
    }

    .materials-table col:nth-child(2) {
      width: 102.2pt;
    }

    .materials-table col:nth-child(3) {
      width: 102.2pt;
    }

    .materials-table col:nth-child(4) {
      width: 97pt;
    }

    .materials-table th,
    .materials-table td {
      height: 16.1pt;
      padding: 0 3pt;
      border: 0.48pt solid #000;
      font-weight: 400;
      text-align: center;
      vertical-align: middle;
    }

    .materials-table.is-classification-table {
      height: auto;
      font-size: 7pt;
      line-height: 1.08;
    }

    .materials-table.is-classification-table col:nth-child(1) {
      width: 70pt;
    }

    .materials-table.is-classification-table col:nth-child(2) {
      width: 68pt;
    }

    .materials-table.is-classification-table col:nth-child(3) {
      width: 200pt;
    }

    .materials-table.is-classification-table col:nth-child(4) {
      width: 113.2pt;
    }

    .materials-table.is-classification-table th,
    .materials-table.is-classification-table td {
      height: auto;
      padding: 1.25pt 2pt;
      vertical-align: top;
    }

    .materials-table.is-classification-table th {
      vertical-align: middle;
      text-align: center;
      line-height: 1.1;
    }

    .materials-table.is-classification-table td[data-material-cell="chemical"],
    .materials-table.is-classification-table td[data-material-cell="cas"],
    .materials-table.is-classification-table td[data-material-cell="classification"] {
      text-align: left;
      vertical-align: middle;
    }

    .materials-table.is-classification-table td[data-material-cell="concentration"] {
      text-align: center;
      vertical-align: middle;
    }

    .state-panel {
      width: min(100%, 560px);
      margin: 50px auto 0;
      padding: 28px;
      border: 1px solid #d7dee5;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 12px 35px rgba(16, 30, 42, 0.08);
    }

    .state-panel h1 {
      margin: 0 0 10px;
      font-size: 20px;
    }

    .state-panel p {
      margin: 0;
      color: #5b6773;
      line-height: 1.6;
    }

    .state-panel[hidden] {
      display: none;
    }

    @media (max-width: 720px) {
      .toolbar {
        padding: 10px 12px;
      }

      .toolbar-inner {
        gap: 10px;
      }

      .toolbar-title {
        font-size: 13px;
      }

      .toolbar-status {
        font-size: 11px;
      }

      .button {
        min-height: 38px;
        padding: 0 12px;
        font-size: 13px;
      }

      .preview {
        padding: 18px 10px 34px;
      }
    }

    @media print {
      @page {
        size: A4;
        margin: 0;
      }

      body {
        background: #fff;
      }

      .toolbar,
      .state-panel {
        display: none !important;
      }

      .preview {
        padding: 0;
      }

      .paper-stage {
        width: auto;
        height: auto !important;
      }

      .paper {
        position: static;
        width: 210mm;
        height: 297mm;
        margin: 0;
        box-shadow: none;
        opacity: 1;
        transform: none !important;
      }
    }
  </style>
</head>
<body>
  <header class="toolbar">
    <div class="toolbar-inner">
      <div class="toolbar-heading">
        <div class="toolbar-title" id="toolbar-title">Model Document Generator</div>
        <div class="toolbar-status" id="toolbar-status" role="status">Loading configuration...</div>
      </div>
      <div class="toolbar-actions">
        <button class="button button-secondary" id="print-button" type="button" disabled>Print</button>
        <button class="button button-primary" id="download-button" type="button" disabled>Download PDF</button>
      </div>
    </div>
  </header>

  <main class="preview">
    <div class="paper-stage" id="paper-stage">
      <article class="paper" id="paper" aria-busy="true">
        <h1 class="page-title" id="page-title"></h1>
        <p class="batch-info"><strong>Batch:</strong> <span id="batch-value"></span></p>

        <p class="model-title">Model: <span id="model-name"></span></p>
        <img class="brand-logo" id="brand-logo" alt="">

        <section class="specs" id="specifications" aria-label="Product specifications"></section>

        <img class="warning-icon" src="./assets/common/warning-triangle.jpg" alt="">
        <p class="warning-title" id="warning-title"></p>
        <p class="warning-copy" id="warning-copy"></p>

        <div class="certifications">
          <img class="certification" data-cert-key="recycle" alt="">
          <img class="certification" data-cert-key="extinguisher" alt="">
          <img class="certification" data-cert-key="ul" alt="">
          <img class="certification" data-cert-key="ce" alt="">
          <img class="certification" data-cert-key="disposal" alt="">
        </div>

        <h2 class="table-heading" id="materials-heading"></h2>
        <table class="materials-table" id="materials-table">
          <colgroup>
            <col>
            <col>
            <col>
            <col>
          </colgroup>
          <thead>
            <tr id="materials-header"></tr>
          </thead>
          <tbody id="materials-body"></tbody>
        </table>
      </article>
    </div>

    <section class="state-panel" id="state-panel" hidden>
      <h1 id="state-title">Unable to load model</h1>
      <p id="state-message"></p>
    </section>
  </main>

  <script src="./assets/vendor/html2canvas.min.js"></script>
  <script src="./assets/vendor/jspdf.umd.min.js"></script>
  <script>
    (function () {
      "use strict";

      const MANIFEST_URL = "./models/manifest.json";
      const BATCH_REGISTRY_URL = "./models/batches.json";
      const DIAGNOSTICS_KEY = "modelPage.diagnostics.v1";
      const MAX_DIAGNOSTICS = 20;
      const MAX_BODY_PREVIEW = 4000;
      const MAX_LEGACY_MATERIAL_ROWS = 4;
      const MAX_CLASSIFICATION_MATERIALS = 6;
      const MAX_CLASSIFICATION_LINES = 14;

      const paper = document.getElementById("paper");
      const stage = document.getElementById("paper-stage");
      const toolbarTitle = document.getElementById("toolbar-title");
      const toolbarStatus = document.getElementById("toolbar-status");
      const downloadButton = document.getElementById("download-button");
      const printButton = document.getElementById("print-button");
      const statePanel = document.getElementById("state-panel");
      const stateTitle = document.getElementById("state-title");
      const stateMessage = document.getElementById("state-message");
      const specs = document.getElementById("specifications");

      let manifest = null;
      let modelConfig = null;
      let batchValue = null;
      let renderReady = false;

      function normalizeLookupKey(value) {
        return String(value || "").trim().toLocaleLowerCase("en-US");
      }

      function isClassificationMaterials(rows) {
        return Array.isArray(rows) && rows.some(function (row) {
          return Array.isArray(row.classifications);
        });
      }

      function serializeError(error) {
        if (!error) {
          return null;
        }
        return {
          name: error.name || "Error",
          message: error.message || String(error),
          stack: error.stack || "",
          cause: error.cause
            ? {
                name: error.cause.name || "Error",
                message: error.cause.message || String(error.cause),
                stack: error.cause.stack || ""
              }
            : null
        };
      }

      function getDiagnostics() {
        try {
          const entries = JSON.parse(localStorage.getItem(DIAGNOSTICS_KEY) || "[]");
          return Array.isArray(entries) ? entries : [];
        } catch (error) {
          console.error("[ModelPage] Unable to read diagnostic logs.", error);
          return [];
        }
      }

      function logDiagnostic(context, error, details) {
        const entry = {
          timestamp: new Date().toISOString(),
          context: context || "Unknown error",
          url: window.location.href,
          userAgent: navigator.userAgent,
          error: serializeError(error),
          details: details || (error && error.details) || null
        };

        console.error("[ModelPage]", context, entry, error || "");

        try {
          const entries = getDiagnostics();
          entries.push(entry);
          localStorage.setItem(
            DIAGNOSTICS_KEY,
            JSON.stringify(entries.slice(-MAX_DIAGNOSTICS))
          );
        } catch (storageError) {
          console.error("[ModelPage] Unable to persist diagnostic log.", storageError);
        }

        return entry;
      }

      function createDiagnosticError(message, details, cause) {
        const error = new Error(message);
        error.details = details || null;
        if (cause) {
          error.cause = cause;
        }
        return error;
      }

      async function fetchResource(url) {
        try {
          return await fetch(url, { cache: "no-cache" });
        } catch (error) {
          throw createDiagnosticError("Network request failed.", { source: url }, error);
        }
      }

      async function readJsonResponse(response, source) {
        const text = await response.text();
        const details = {
          source: source,
          responseUrl: response.url,
          status: response.status,
          contentType: response.headers.get("content-type") || "",
          bodyLength: text.length,
          bodyPreview: text.slice(0, MAX_BODY_PREVIEW)
        };

        try {
          return JSON.parse(text.replace(/^\uFEFF/, ""));
        } catch (error) {
          throw createDiagnosticError("Invalid JSON response.", details, error);
        }
      }

      function setStatus(message, isError) {
        toolbarStatus.textContent = message;
        toolbarStatus.classList.toggle("is-error", Boolean(isError));
      }

      function showError(title, message) {
        renderReady = false;
        paper.hidden = true;
        statePanel.hidden = false;
        stateTitle.textContent = title;
        stateMessage.textContent = message;
        toolbarTitle.textContent = title;
        setStatus(message, true);
        downloadButton.disabled = true;
        printButton.disabled = true;
        fitPreview();
      }

      function showNotFound() {
        showError("Page not found", "The requested page is unavailable.");
      }

      function setText(element, value) {
        element.textContent = value == null ? "" : String(value);
      }

      function buildModelLookup(catalog) {
        const lookup = new Map();
        Object.entries(catalog.models || {}).forEach(function (entry) {
          const [key, value] = entry;
          const keys = [key, value.id].concat(value.aliases || []);
          keys.forEach(function (alias) {
            lookup.set(normalizeLookupKey(alias), value);
          });
        });
        return lookup;
      }

      function validateConfig(config) {
        if (!config || config.schemaVersion !== 1) {
          throw new Error("The model configuration has an unsupported schema version.");
        }
        if (!/^[a-z0-9][a-z0-9-]{0,63}$/.test(config.id || "")) {
          throw new Error("The model ID must use lowercase letters, numbers, and hyphens.");
        }
        if (!Array.isArray(config.specifications) || config.specifications.length === 0) {
          throw new Error("The model configuration does not contain specifications.");
        }
        if (!config.contact || !config.warning || !config.brand) {
          throw new Error("The model configuration is missing required sections.");
        }
        if (!config.materials || !Array.isArray(config.materials.rows)) {
          throw new Error("The model configuration does not contain material rows.");
        }
        const classificationTable = isClassificationMaterials(config.materials.rows);
        if (classificationTable) {
          const classificationLines = config.materials.rows.reduce(function (total, row) {
            return total + (Array.isArray(row.classifications) ? row.classifications.length : 0);
          }, 0);
          if (config.materials.rows.length > MAX_CLASSIFICATION_MATERIALS) {
            throw new Error("This A4 template supports at most " + MAX_CLASSIFICATION_MATERIALS + " classified materials.");
          }
          if (classificationLines > MAX_CLASSIFICATION_LINES) {
            throw new Error("This A4 template supports at most " + MAX_CLASSIFICATION_LINES + " classification lines.");
          }
          const invalidRow = config.materials.rows.find(function (row) {
            return !row.chemical || !row.cas || !row.concentration || !Array.isArray(row.classifications) || row.classifications.length === 0;
          });
          if (invalidRow) {
            throw new Error("Each classified material requires chemical, cas, classifications, and concentration.");
          }
        } else if (config.materials.rows.length > MAX_LEGACY_MATERIAL_ROWS) {
          throw new Error("This A4 template supports at most " + MAX_LEGACY_MATERIAL_ROWS + " material rows.");
        }
        if (!Array.isArray(config.materials.columns) || config.materials.columns.length !== 4) {
          throw new Error("The material table must define exactly four columns.");
        }
        if (typeof config.brand.logo !== "string" || !config.brand.logo.startsWith("./assets/")) {
          throw new Error("The brand logo must use a local ./assets/ path.");
        }
        (config.certifications || []).forEach(function (item) {
          if (typeof item.src !== "string" || !item.src.startsWith("./assets/")) {
            throw new Error("Certification images must use local ./assets/ paths.");
          }
        });
      }

      function appendSpecification(label, value) {
        const row = document.createElement("p");
        if (label) {
          const labelElement = document.createElement("span");
          labelElement.textContent = label + ": ";
          row.appendChild(labelElement);
        }
        row.appendChild(document.createTextNode(value == null ? "" : String(value)));
        specs.appendChild(row);
      }

      function renderSpecifications(config) {
        specs.replaceChildren();

        config.specifications.forEach(function (item) {
          appendSpecification(item.label, item.value);
        });

        const contact = config.contact;
        appendSpecification("Manufacturer", contact.manufacturer);
        appendSpecification("Address", contact.address);

        const contactRow = document.createElement("p");
        contactRow.className = "email-phone";
        const email = document.createElement("span");
        const phone = document.createElement("span");
        email.textContent = "Email: " + contact.email;
        phone.textContent = "Phone: " + contact.phone;
        contactRow.append(email, phone);
        specs.appendChild(contactRow);
      }

      function renderWarning(warning) {
        setText(document.getElementById("warning-title"), warning.title);
        const warningCopy = document.getElementById("warning-copy");
        warningCopy.replaceChildren();

        (warning.lines || []).forEach(function (line) {
          const row = document.createElement("span");
          row.textContent = line;
          warningCopy.appendChild(row);
        });
      }

      function fitWarningText() {
        const warningCopy = document.getElementById("warning-copy");
        const lines = Array.from(warningCopy.querySelectorAll("span"));
        let fontSize = 10.45;
        warningCopy.style.fontSize = fontSize + "pt";

        while (
          lines.some(function (line) {
            return line.scrollWidth > warningCopy.clientWidth;
          }) &&
          fontSize > 8.4
        ) {
          fontSize -= 0.1;
          warningCopy.style.fontSize = fontSize + "pt";
        }
      }

      function renderCertifications(items) {
        const allowedKeys = new Set(["ul", "ce", "recycle", "extinguisher", "disposal"]);
        const images = new Map(
          Array.from(document.querySelectorAll("[data-cert-key]")).map(function (image) {
            return [image.dataset.certKey, image];
          })
        );

        images.forEach(function (image) {
          image.classList.remove("is-visible");
          image.removeAttribute("src");
          image.alt = "";
        });

        (items || []).forEach(function (item) {
          if (!allowedKeys.has(item.key)) {
            return;
          }
          const image = images.get(item.key);
          image.src = item.src;
          image.alt = item.alt || "";
          image.classList.add("is-visible");
        });
      }

      function renderMaterials(materials) {
        setText(document.getElementById("materials-heading"), materials.heading);

        const table = document.getElementById("materials-table");
        const classificationTable = isClassificationMaterials(materials.rows);
        table.classList.toggle("is-classification-table", classificationTable);

        const header = document.getElementById("materials-header");
        header.replaceChildren();
        materials.columns.forEach(function (column) {
          const cell = document.createElement("th");
          cell.textContent = column;
          header.appendChild(cell);
        });

        const body = document.getElementById("materials-body");
        body.replaceChildren();

        if (classificationTable) {
          materials.rows.forEach(function (material) {
            material.classifications.forEach(function (classification, classificationIndex) {
              const tr = document.createElement("tr");

              if (classificationIndex === 0) {
                [
                  { value: material.chemical, type: "chemical" },
                  { value: material.cas, type: "cas" }
                ].forEach(function (item) {
                  const cell = document.createElement("td");
                  cell.rowSpan = material.classifications.length;
                  cell.dataset.materialCell = item.type;
                  cell.textContent = item.value;
                  tr.appendChild(cell);
                });
              }

              const classificationCell = document.createElement("td");
              classificationCell.dataset.materialCell = "classification";
              classificationCell.textContent = classification;
              tr.appendChild(classificationCell);

              if (classificationIndex === 0) {
                const concentrationCell = document.createElement("td");
                concentrationCell.rowSpan = material.classifications.length;
                concentrationCell.dataset.materialCell = "concentration";
                concentrationCell.textContent = material.concentration;
                tr.appendChild(concentrationCell);
              }

              body.appendChild(tr);
            });
          });
        } else {
          materials.rows.forEach(function (row) {
            const tr = document.createElement("tr");
            [row.components, row.cas, row.tlv, row.weight].forEach(function (value) {
              const cell = document.createElement("td");
              cell.textContent = value;
              tr.appendChild(cell);
            });
            body.appendChild(tr);
          });
        }
      }

      function fitSpecifications() {
        specs.style.fontSize = "10.45pt";
        specs.style.lineHeight = "13.98pt";

        Array.from(specs.children).forEach(function (row) {
          row.style.marginBottom = "9.42pt";
        });

        if (specs.lastElementChild) {
          specs.lastElementChild.style.marginBottom = "0";
        }

        let fontSize = 10.45;
        let lineHeight = 13.98;
        let gap = 9.42;
        let attempts = 0;

        while (specs.scrollHeight > specs.clientHeight + 1 && attempts < 18) {
          fontSize = Math.max(7.8, fontSize - 0.15);
          lineHeight = Math.max(10.4, lineHeight - 0.18);
          gap = gap > 5.5 ? gap - 0.24 : gap;
          specs.style.fontSize = fontSize + "pt";
          specs.style.lineHeight = lineHeight + "pt";
          Array.from(specs.children).forEach(function (row) {
            row.style.lineHeight = lineHeight + "pt";
            row.style.marginBottom = gap + "pt";
          });
          if (specs.lastElementChild) {
            specs.lastElementChild.style.marginBottom = "0";
          }
          attempts += 1;
        }
      }

      function renderConfig(config) {
        validateConfig(config);

        setText(document.getElementById("page-title"), config.pageTitle);
        setText(document.getElementById("model-name"), config.displayName);
        setText(document.getElementById("batch-value"), batchValue);

        const logo = document.getElementById("brand-logo");
        logo.src = config.brand.logo;
        logo.alt = config.brand.name || "";

        renderSpecifications(config);
        renderWarning(config.warning);
        renderCertifications(config.certifications);
        renderMaterials(config.materials);
        fitSpecifications();
        fitWarningText();

        toolbarTitle.textContent = config.pageTitle;
        document.title = config.pageTitle;
        paper.setAttribute("aria-busy", "false");
      }

      async function waitForAssets() {
        await document.fonts.ready;
        const images = Array.from(paper.querySelectorAll("img"));
        await Promise.all(
          images.map(function (image) {
            if (image.complete) {
              if (image.naturalWidth === 0) {
                logDiagnostic(
                  "Asset failed to load.",
                  createDiagnosticError("Image failed to load.", {
                    src: image.src,
                    alt: image.alt || ""
                  })
                );
              }
              return Promise.resolve();
            }
            return new Promise(function (resolve) {
              image.addEventListener("load", resolve, { once: true });
              image.addEventListener(
                "error",
                function () {
                  logDiagnostic(
                    "Asset failed to load.",
                    createDiagnosticError("Image failed to load.", {
                      src: image.src,
                      alt: image.alt || ""
                    })
                  );
                  resolve();
                },
                { once: true }
              );
            });
          })
        );
      }

      function fitPreview() {
        const availableWidth = stage.clientWidth;
        const naturalWidth = paper.offsetWidth;
        if (!naturalWidth || paper.hidden) {
          stage.style.height = statePanel.hidden ? "0px" : "auto";
          return;
        }

        const scale = Math.min(1, availableWidth / naturalWidth);
        const scaledWidth = naturalWidth * scale;
        const horizontalOffset = Math.max(0, (availableWidth - scaledWidth) / 2);

        paper.style.transform = "scale(" + scale + ")";
        paper.style.left = horizontalOffset + "px";
        stage.style.height = (paper.offsetHeight * scale) + "px";
      }

      function safeFileName(value) {
        return String(value || "")
          .replace(/[<>:"/\\|?*\u0000-\u001f]/g, "_")
          .replace(/\s+/g, "_")
          .slice(0, 80);
      }

      async function downloadPdf() {
        if (!renderReady || typeof window.html2canvas !== "function" || !window.jspdf) {
          return;
        }

        const originalLabel = downloadButton.textContent;
        downloadButton.disabled = true;
        printButton.disabled = true;
        downloadButton.textContent = "Generating...";
        setStatus("Generating PDF...", false);

        try {
          paper.style.transform = "none";
          paper.style.left = "0";
          await waitForAssets();
          await new Promise(function (resolve) {
            requestAnimationFrame(function () {
              requestAnimationFrame(resolve);
            });
          });

          const canvas = await window.html2canvas(paper, {
            scale: 2,
            useCORS: true,
            backgroundColor: "#ffffff",
            logging: false,
            scrollX: 0,
            scrollY: 0,
            width: paper.offsetWidth,
            height: paper.offsetHeight,
            windowWidth: paper.offsetWidth,
            windowHeight: paper.offsetHeight
          });
          const imageData = canvas.toDataURL("image/jpeg", 0.98);
          const pdf = new window.jspdf.jsPDF({
            unit: "mm",
            format: "a4",
            orientation: "portrait",
            compress: true
          });

          pdf.addImage(imageData, "JPEG", 0, 0, 210, 297, undefined, "FAST");
          pdf.save(
            safeFileName(modelConfig.id) +
              "_" +
              safeFileName(modelConfig.displayName) +
              "_" +
              safeFileName(batchValue) +
              ".pdf"
          );
          setStatus("PDF generated.", false);
        } catch (error) {
          logDiagnostic("PDF generation failed.", error, {
            modelId: modelConfig && modelConfig.id,
            batch: batchValue
          });
          setStatus("PDF generation failed. Use Print instead.", true);
        } finally {
          fitPreview();
          downloadButton.disabled = !renderReady;
          printButton.disabled = !renderReady;
          downloadButton.textContent = originalLabel;
        }
      }

      async function initialize() {
        downloadButton.disabled = true;
        printButton.disabled = true;
        setStatus("Loading configuration...", false);

        try {
          const params = new URLSearchParams(window.location.search);
          const [manifestResponse, batchesResponse] = await Promise.all([
            fetchResource(MANIFEST_URL),
            fetchResource(BATCH_REGISTRY_URL)
          ]);
          if (!manifestResponse.ok || !batchesResponse.ok) {
            throw createDiagnosticError("Unable to load model or batch configuration.", {
              manifest: {
                url: manifestResponse.url,
                status: manifestResponse.status
              },
              batches: {
                url: batchesResponse.url,
                status: batchesResponse.status
              }
            });
          }

          manifest = await readJsonResponse(manifestResponse, MANIFEST_URL);
          const batchRegistry = await readJsonResponse(
            batchesResponse,
            BATCH_REGISTRY_URL
          );
          const lookup = buildModelLookup(manifest);
          const requestedModel = params.get("model") || manifest.default;
          const entry = lookup.get(normalizeLookupKey(requestedModel));
          const requestedBatch = (params.get("batch") || params.get("time") || "").trim();

          if (!entry || !requestedBatch) {
            logDiagnostic("Model page lookup failed.", null, {
              requestedModel: requestedModel,
              requestedBatch: requestedBatch,
              reason: !entry ? "unknown-model" : "missing-batch"
            });
            showNotFound();
            return;
          }

          const allowedBatches = batchRegistry.models && batchRegistry.models[entry.id];
          if (!Array.isArray(allowedBatches) || !allowedBatches.includes(requestedBatch)) {
            logDiagnostic("Model page lookup failed.", null, {
              requestedModel: requestedModel,
              requestedBatch: requestedBatch,
              modelId: entry.id,
              reason: "batch-not-allowed",
              allowedBatches: allowedBatches || []
            });
            showNotFound();
            return;
          }

          batchValue = requestedBatch;

          const configResponse = await fetchResource(entry.file);
          if (!configResponse.ok) {
            throw createDiagnosticError("Unable to load model configuration.", {
              source: entry.file,
              responseUrl: configResponse.url,
              status: configResponse.status,
              contentType: configResponse.headers.get("content-type") || ""
            });
          }

          modelConfig = await readJsonResponse(configResponse, entry.file);
          if (normalizeLookupKey(modelConfig.id) !== normalizeLookupKey(entry.id)) {
            throw createDiagnosticError("Model configuration ID does not match the manifest.", {
              source: entry.file,
              expectedId: entry.id,
              actualId: modelConfig.id
            });
          }
          renderConfig(modelConfig);
          await waitForAssets();
          fitSpecifications();
          fitWarningText();
          fitPreview();
          renderReady = true;
          downloadButton.disabled = false;
          printButton.disabled = false;
          setStatus("Ready.", false);
        } catch (error) {
          logDiagnostic("Model page initialization failed.", error);
          showError(
            "Unable to load model",
            "The page could not be loaded. Please check the link and try again."
          );
        }
      }

      printButton.addEventListener("click", function () {
        window.print();
      });
      downloadButton.addEventListener("click", downloadPdf);
      window.addEventListener("resize", fitPreview);
      window.addEventListener("beforeprint", function () {
        paper.style.transform = "none";
        paper.style.left = "0";
      });
      window.addEventListener("afterprint", fitPreview);

      window.modelPageDiagnostics = {
        get: getDiagnostics,
        clear: function () {
          try {
            localStorage.removeItem(DIAGNOSTICS_KEY);
          } catch (error) {
            console.error("[ModelPage] Unable to clear diagnostic logs.", error);
          }
        }
      };

      window.addEventListener("error", function (event) {
        if (event.error) {
          logDiagnostic("Unhandled runtime error.", event.error);
          return;
        }
        logDiagnostic(
          "Unhandled runtime error.",
          createDiagnosticError(event.message || "Unknown runtime error.", {
            source: event.filename || "",
            line: event.lineno || 0,
            column: event.colno || 0
          })
        );
      });

      window.addEventListener("unhandledrejection", function (event) {
        logDiagnostic("Unhandled promise rejection.", event.reason);
      });

      initialize();
    })();
  </script>
</body>
</html>
